syntax = "proto3";

package rips;

import "Definitions.proto";

service KeyValueStore {
  rpc SetValue(stream KeyValueStoreInputChunk)
      returns (ClientToServerStreamReply) {}
  rpc GetValue(KeyValueStoreOutputRequest)
      returns (stream KeyValueStoreOutputChunk) {}
  rpc RemoveValue(KeyValueStoreRemoveRequest) returns (Empty) {}
}

message KeyValueStoreInputChunk {
  oneof KeyValueStoreChunkType {
    KeyValueInputParameters parameters = 1;
    KeyValueStoreChunk values = 2;
  }
}

// Element type of the values stored for a key
enum KeyValueElementType {
  KEY_VALUE_ELEMENT_TYPE_FLOAT32 = 0;
  KEY_VALUE_ELEMENT_TYPE_FLOAT64 = 1;
  KEY_VALUE_ELEMENT_TYPE_INT32 = 2;
  KEY_VALUE_ELEMENT_TYPE_INT64 = 3;
  KEY_VALUE_ELEMENT_TYPE_UINT32 = 4;
  KEY_VALUE_ELEMENT_TYPE_UINT64 = 5;
}

message KeyValueInputParameters {
  // Name needs to be sent in the first message
  string name = 1;
  int64 num_elements = 2;
  KeyValueElementType element_type = 3;
}

// FLOAT32 values travel in values, FLOAT64 in double_values, INT32 and INT64
// in int_values, UINT32 and UINT64 in uint_values
message KeyValueStoreChunk {
  repeated float values = 1;
  repeated double double_values = 2;
  repeated sint64 int_values = 3;
  repeated uint64 uint_values = 4;
}

message KeyValueStoreOutputRequest {
  string name = 1;
  KeyValueElementType element_type = 2;
}

message KeyValueStoreOutputChunk {
  repeated float values = 1;
  repeated double double_values = 2;
  repeated sint64 int_values = 3;
  repeated uint64 uint_values = 4;
}

message KeyValueStoreRemoveRequest { string name = 1; }
