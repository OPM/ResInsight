name: Python Linting

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Create a PR with ruff fixes"
        type: boolean
        default: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install "ruff==0.15.*"

      # Always run strict lint check (catches all errors including unfixable ones)
      - name: (Python) Check with ruff
        run: |
          cd GrpcInterface
          ruff check .
          ruff format --check --diff .

      # Manual trigger only: Apply auto-fixable issues and create PR
      - name: (Python) Auto-fix
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.create_pr
        run: |
          cd GrpcInterface
          ruff check --fix .
          ruff format .
      - uses: peter-evans/create-pull-request@v8
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.create_pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Python code linting changes detected by ruff"
          title: "Fixes by ruff (Python)"
          branch: python-ruff-patches
          branch-suffix: random
          base: ${{ github.ref_name }}

