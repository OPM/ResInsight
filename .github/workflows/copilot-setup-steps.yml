name: Copilot Setup Steps

# Pre-flight job that GitHub Copilot's coding agent runs before each session.
# The job name MUST be `copilot-setup-steps` for the agent to pick it up.
#
# Runs inside the prebuilt ghcr.io/<repo>/ci-ubuntu24 image
# (see .github/docker/Dockerfile.ubuntu24) so the toolchain, Qt, vcpkg binary
# cache, and warm ResInsight buildcache are already provisioned. The setup
# only has to fetch the source, install the editable rips package, and warm
# an incremental build for the agent.
#
# Source-path note: the image's warm buildcache was populated at /src
# (buildcache hashes the absolute source path baked into compile commands).
# actions/checkout puts source at $GITHUB_WORKSPACE; we symlink /src ->
# $GITHUB_WORKSPACE and configure at /src so every gcc command line uses
# /src/... and matches the baked cache entries. CMake records
# CMAKE_SOURCE_DIR as the string passed to -S without resolving symlinks,
# so this works transparently. The agent's editor still sees the source at
# $GITHUB_WORKSPACE; edits land on the real files /src/... resolves to.
#
# Manual triggers below are for testing the file itself. The agent invokes
# the job automatically -- no trigger is required for that path.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/resinsight/ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fetch default branch reference
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          default_branch="${{ github.event.repository.default_branch }}"
          if [ -n "$default_branch" ]; then
            git fetch --no-tags origin "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          fi

      - name: Symlink /src -> workspace
        # Aligns the absolute source path with the image's baked buildcache
        # so the agent's first incremental build hits cache. See file header
        # for the buildcache hashing rationale.
        run: ln -sfn "$GITHUB_WORKSPACE" /src

      - name: Install rips dev dependencies
        # rips/_version.py is normally generated by CMake; create a dev
        # fallback so the editable install below can resolve the version
        # before configure runs.
        run: |
          echo '__version__ = "0.0.0.dev"' > /src/GrpcInterface/Python/rips/_version.py
          python3 -m pip install -e /src/GrpcInterface/Python[dev]

      - name: Bootstrap vcpkg
        # /src was freshly checked out, so the ThirdParty/vcpkg/vcpkg binary
        # produced by bootstrap-vcpkg.sh is not present. The image's baked
        # /opt/vcpkg-cache-gcc supplies prebuilt dependencies; the binary
        # itself still has to exist locally for `vcpkg install` to run.
        run: /src/ThirdParty/vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        env:
          # vcpkg's compiler-hash detection runs before the CMake toolchain
          # file is loaded, so -DCMAKE_C_COMPILER on the cmake line is too
          # late -- vcpkg picks up /usr/bin/c++ (gcc-13 on Ubuntu 24.04) and
          # computes an ABI hash that does not match the gcc-14 entries baked
          # into /opt/vcpkg-cache-gcc. Forcing CC/CXX in the env matches what
          # the Dockerfile's vcpkg-builder-gcc stage exports.
          CC: gcc-14
          CXX: g++-14
          VCPKG_FEATURE_FLAGS: binarycaching
          # Read vcpkg dependencies from the gcc binary cache baked into the
          # image. buildcache is auto-discovered on PATH by CMakeLists.txt's
          # find_program() and wired as CMAKE_CXX_COMPILER_LAUNCHER -- no
          # explicit setup step is needed. BUILDCACHE_DIR/ACCURACY are baked
          # in the image ENV (defaults target the gcc-14 leg). Unity build
          # must be OFF to match the warmup build (mismatched flag would
          # collapse the cache hit rate).
          VCPKG_BINARY_SOURCES: "clear;files,/opt/vcpkg-cache-gcc,read"
        run: |
          cmake -S /src -B /src/cmakebuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DRESINSIGHT_INCLUDE_APPLICATION_UNIT_TESTS=true \
            -DRESINSIGHT_ENABLE_PRECOMPILED_HEADERS=false \
            -DRESINSIGHT_ENABLE_UNITY_BUILD=false \
            -DRESINSIGHT_ENABLE_GRPC=true \
            -DRESINSIGHT_GRPC_PYTHON_EXECUTABLE=$(command -v python3) \
            -DRESINSIGHT_GRPC_DOWNLOAD_PYTHON_MODULE=true \
            -DRESINSIGHT_ENABLE_HDF5=false \
            -DCMAKE_TOOLCHAIN_FILE=ThirdParty/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (warm buildcache for agent)
        # Builds the default targets so the agent's first incremental build
        # only recompiles what it edits. Unity build is off (set above) so a
        # single .cpp change doesn't invalidate a whole unity blob.
        run: cmake --build /src/cmakebuild

      - name: buildcache stats
        # Watch the hit rate here. If significantly < 80%, something is
        # invalidating the cache (CMake flag drift, path resolution leaking
        # through realpath, etc.) and the symlink approach is not paying
        # off -- fall back to a manual clone into /src.
        run: buildcache -s
