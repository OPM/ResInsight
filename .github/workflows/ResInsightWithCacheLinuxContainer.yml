name: ResInsight Build With Cache (Linux container)

# Parallel companion to ResInsightWithCache.yml's Linux legs. Runs both the
# Ubuntu 24.04 / gcc-14 and Ubuntu 24.04 / clang-19 builds inside the prebuilt
# image at ghcr.io/<repo>/ci-ubuntu24:latest -- baked with both toolchains,
# Qt, a per-compiler vcpkg binary cache, and a warm ResInsight buildcache.
#
# See:
#   * .github/docker/Dockerfile.ubuntu24       (what the image contains)
#   * .github/workflows/build-ubuntu24-image.yml  (nightly image build)
#
# The non-containerized Linux legs in ResInsightWithCache.yml continue to run
# in parallel during validation; once this workflow is stable, those legs will
# be removed in a follow-up PR.

on:
  push:
  pull_request:
  schedule:
    # 01:00 UTC -- one hour after the nightly image build at 00:00 UTC.
    - cron: '0 1 * * *'

concurrency:
  group: build-linux-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves the prebuilt CI image name so the workflow works in forks and
  # upstream alike (GHCR requires a lowercase repository path).
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ci-ubuntu24:latest" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Ubuntu 24.04 gcc-14 (container)"
            cc: gcc-14
            cxx: g++-14
            buildcache_dir: /opt/buildcache-gcc
            vcpkg_cache: /opt/vcpkg-cache-gcc
            execute_pytests: true
            publish_to_pypi: true
          - name: "Ubuntu 24.04 clang-19 (container)"
            cc: clang-19
            cxx: clang++-19
            buildcache_dir: /opt/buildcache-clang
            vcpkg_cache: /opt/vcpkg-cache-clang
            execute_pytests: false
            publish_to_pypi: false
    container:
      # Prebuilt image with both toolchains, baked vcpkg binary caches, and
      # warm ResInsight buildcaches at /opt/buildcache-{gcc,clang}.
      # See .github/workflows/build-ubuntu24-image.yml
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Source must live at /src to match the path the image's warmup compiled
    # at; buildcache hashes the absolute source path so any drift collapses
    # the hit rate. The clone step overrides this default since /src does not
    # exist yet at that point.
    defaults:
      run:
        working-directory: /src
    env:
      BUILD_TYPE: Release
      BUILDCACHE_DIR: ${{ matrix.config.buildcache_dir }}
      BUILDCACHE_ACCURACY: SLOPPY

    steps:
      - name: Clone source into /src
        working-directory: /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # actions/checkout writes inside GITHUB_WORKSPACE (e.g.
        # /__w/ResInsight/ResInsight) which would not match the image's baked
        # cache path. Clone manually into /src instead. GITHUB_SHA is fetched
        # directly (GitHub allows any-SHA fetches on the workflow's own repo).
        #
        # The insteadOf rewrite is unset after the clone so the token is not
        # left in /etc/gitconfig where a later `git config --list` for
        # diagnostics could echo it into the log.
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /src
          cd /src
          git fetch --no-tags --depth 1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git config --global --unset url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf

      # /src was just freshly cloned, so the ThirdParty/vcpkg/vcpkg binary
      # produced by bootstrap-vcpkg.sh is not present. The image's baked
      # vcpkg cache supplies prebuilt dependencies; the binary itself still
      # has to exist locally for `vcpkg install` to run.
      - name: Bootstrap vcpkg
        run: |
          cd ThirdParty/vcpkg
          ./bootstrap-vcpkg.sh

      - name: Install Python dev dependencies
        # rips package is required for pytest and mypy. PEP 668 marks Ubuntu
        # 24.04's system Python as externally managed; --break-system-packages
        # is the pragmatic path for a single-purpose CI container.
        run: |
          # rips/_version.py is normally generated by CMake; create a dev
          # fallback so the editable install below can resolve the version.
          echo '__version__ = "0.0.0.dev"' > GrpcInterface/Python/rips/_version.py
          python3 -m pip install --break-system-packages -e GrpcInterface/Python[dev]

      - name: Configure
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
          VCPKG_FEATURE_FLAGS: binarycaching
          # Read vcpkg dependencies from the per-compiler binary cache baked
          # into the image. buildcache is auto-discovered on PATH by
          # CMakeLists.txt's find_program() and wired as
          # CMAKE_CXX_COMPILER_LAUNCHER -- no explicit setup step is needed.
          # Unity build must be OFF to match the warmup build (mismatched
          # flag would collapse the cache hit rate).
          VCPKG_BINARY_SOURCES: "clear;files,${{ matrix.config.vcpkg_cache }},read"
        run: |
          cmake -S /src -B /src/cmakebuild -G Ninja \
            -DVCPKG_BUILD_TYPE=release \
            -DCMAKE_INSTALL_PREFIX=/src/cmakebuild/install \
            -DCMAKE_BUILD_TYPE=Release \
            -DRESINSIGHT_INCLUDE_APPLICATION_UNIT_TESTS=true \
            -DRESINSIGHT_TREAT_WARNINGS_AS_ERRORS=true \
            -DRESINSIGHT_ENABLE_PRECOMPILED_HEADERS=false \
            -DRESINSIGHT_ENABLE_UNITY_BUILD=false \
            -DRESINSIGHT_ENABLE_GRPC=true \
            -DRESINSIGHT_GRPC_PYTHON_EXECUTABLE=$(command -v python3) \
            -DRESINSIGHT_GRPC_DOWNLOAD_PYTHON_MODULE=true \
            -DRESINSIGHT_ENABLE_HDF5=false \
            -DCMAKE_TOOLCHAIN_FILE=ThirdParty/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build /src/cmakebuild --target install

      - name: Stats for buildcache
        if: always()
        run: buildcache -s

      - name: Run Unit Tests
        run: /src/cmakebuild/ResInsight-tests

      - name: (Python) Build Python module
        run: |
          python3 -m pip install --break-system-packages build wheel
          cd GrpcInterface/Python
          python3 -m build

      - name: (Python) Check types using mypy
        run: |
          python3 -m pip install --break-system-packages mypy types-protobuf
          cd GrpcInterface/Python
          python3 -m mypy rips/*.py rips/generated/generated_classes.py

      - name: Run pytest
        if: matrix.config.execute_pytests
        env:
          RESINSIGHT_EXECUTABLE: /src/cmakebuild/ResInsight
        run: |
          cd GrpcInterface/Python/rips
          python3 -m pytest --console

      - name: Upload python distribution folder
        if: matrix.config.publish_to_pypi
        uses: actions/upload-artifact@v7
        with:
          name: python-distribution
          path: /src/GrpcInterface/Python/dist
          retention-days: 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ResInsight-${{ matrix.config.name }}
          path: /src/cmakebuild/install
          retention-days: 5

  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rips
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    # If this is a tagged release
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: Download python distribution folder
        uses: actions/download-artifact@v8
        with:
          name: python-distribution
          path: dist

      - name: Display structure of downloaded files
        run: ls -R

      - name: Publish Python package to pypi
        # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
        uses: pypa/gh-action-pypi-publish@release/v1
